services:
  postgres:
    build: ./docker/postgres
    container_name: galeria-rd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-galeria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-galeria}
      POSTGRES_DB: ${POSTGRES_DB:-galeria_rd}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
